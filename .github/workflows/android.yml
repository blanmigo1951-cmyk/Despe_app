name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 'latest'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Generar Proyecto de Gradle Blindado
      run: |
        # 1. Crear estructura de carpetas
        mkdir -p android-app/app

        # 2. Configurar settings.gradle
        cat << 'EOF' > android-app/settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "DespeApp"
        include ':app'
        EOF

        # 3. Configurar build.gradle raíz
        cat << 'EOF' > android-app/build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 4. Configurar app/build.gradle tolerante a errores de lint/código
        cat << 'EOF' > android-app/app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'

        android {
            namespace 'com.example.builder'
            compileSdk 34
            buildToolsVersion "34.0.0"

            defaultConfig {
                applicationId 'com.example.builder'
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
                multiDexEnabled true
            }

            lintOptions {
                checkReleaseBuilds false
                abortOnError false
                ignoreWarnings true
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'androidx.viewpager2:viewpager2:1.0.0'
            implementation 'com.squareup.retrofit2:retrofit:2.9.0'
            implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
            implementation 'com.squareup.okhttp3:okhttp:4.11.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
            implementation 'androidx.lifecycle:lifecycle-service:2.6.1'
            implementation 'androidx.multidex:multidex:2.0.1'
        }
        EOF

    - name: Compilar APK sin Verificaciones Estrictas
      run: |
        cd android-app
        gradle clean :app:assembleDebug -x test -x lint --stacktrace

    - name: Subir APK Generado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "android-app/app/build/outputs/apk/debug/*.apk"
