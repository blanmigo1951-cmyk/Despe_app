name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Preparar Proyecto y Compilar
      run: |
        # Crear estructura de carpetas si no existe
        mkdir -p android-app/app

        cd android-app

        # 1. Detectar package de forma segura
        PKG_NAME=$(grep -rn "^package " app/src/main/ 2>/dev/null | head -n 1 | awk '{print $2}' | tr -d ';\r\n')
        if [ -z "$PKG_NAME" ]; then
          PKG_NAME="com.example.builder"
        fi
        echo "Package utilizado: $PKG_NAME"

        # 2. Configurar settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "DespeApp"
        include ':app'
        EOF

        # 3. Configurar build.gradle raíz con bloque de plugins moderno
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
            id 'org.jetbrains.kotlin.android' version '1.8.22' apply false
        }
        EOF

        # 4. Configurar app/build.gradle usando archivos limpios
        cat << EOF > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace '$PKG_NAME'
            compileSdk 33

            defaultConfig {
                applicationId '$PKG_NAME'
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.10.1'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'com.squareup.retrofit2:retrofit:2.9.0'
            implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
            implementation 'com.squareup.okhttp3:okhttp:4.11.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
            implementation 'androidx.lifecycle:lifecycle-service:2.6.1'
        }
        EOF

        # 5. Ejecutar la compilación directa con Gradle Global
        gradle :app:assembleDebug

    - name: Subir APK Generado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "android-app/app/build/outputs/apk/debug/*.apk"
