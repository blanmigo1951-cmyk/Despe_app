name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Repair structure and build APK
      run: |
        # 1. Moverse al directorio del proyecto Android
        cd android-app
        
        # 2. Si falta settings.gradle, crearlo vinculando el módulo app
        if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
          echo "include ':app'" > settings.gradle
        fi
        
        # 3. Generar el wrapper oficial de Gradle para evitar incompatibilidades
        gradle wrapper
        
        # 4. Dar permisos de ejecución
        chmod +x gradlew
        
        # 5. Compilar la tarea del módulo :app
        ./gradlew :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android-app/app/build/outputs/apk/debug/*.apk
