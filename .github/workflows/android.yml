name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Diagnostico y Build
      run: |
        echo "--- ANALIZANDO ARCHIVOS ---"
        cd android-app
        # Listar todo recursivamente para ver qué archivos llegaron a GitHub
        ls -R
        
        # Verificar si existe el build.gradle necesario para compilar
        if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
          echo "=========================================================="
          echo "ERROR: NO ENCONTRÉ 'app/build.gradle'."
          echo "Tu proyecto en GitHub no tiene la estructura de Android completa."
          echo "=========================================================="
          exit 1
        fi

        echo "--- TODO OK. INICIANDO COMPILACIÓN ---"
        gradle wrapper
        chmod +x gradlew
        ./gradlew :app:assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android-app/app/build/outputs/apk/debug/*.apk
