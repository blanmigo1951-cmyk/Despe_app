name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v3

    - name: Locate project and ensure Gradle Wrapper
      run: |
        # Buscar el directorio donde está el proyecto Android
        if [ -f "android-app/build.gradle" ] || [ -f "android-app/build.gradle.kts" ]; then
          TARGET_DIR="android-app"
        elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
          TARGET_DIR="."
        else
          TARGET_DIR=$(find . -maxdepth 2 -name "build.gradle*" -exec dirname {} \; | head -n 1)
        fi

        echo "Proyecto encontrado en: $TARGET_DIR"
        echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV

        cd "$TARGET_DIR"

        # Si no existe gradlew, instalar gradle y generarlo
        if [ ! -f "gradlew" ]; then
          echo "gradlew no encontrado. Generando Gradle Wrapper..."
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper
        fi

        chmod +x gradlew

    - name: Build Debug APK
      run: |
        cd ${{ env.TARGET_DIR }}
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          ${{ env.TARGET_DIR }}/app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
