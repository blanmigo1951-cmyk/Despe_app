name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Preparar Entorno Android
      working-directory: android-app
      run: |
        # 1. Extraer package/namespace de forma limpia
        DETECTED_PKG=$(grep -rn "^package " app/src/main/ 2>/dev/null | head -n 1 | awk '{print $2}' | tr -d ';\r\n')
        if [ -z "$DETECTED_PKG" ]; then
          DETECTED_PKG="com.example.builder"
        fi
        echo "Package detectado: '$DETECTED_PKG'"

        # 2. Generar settings.gradle si no existe
        if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
          cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "DespeApp"
        include ':app'
        EOF
        fi

        # 3. Generar build.gradle raiz si no existe
        if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
          cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22'
            }
        }
        EOF
        fi

        # 4. Generar app/build.gradle
        if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
          cat << EOF > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace "${DETECTED_PKG}"
            compileSdk 33

            defaultConfig {
                applicationId "${DETECTED_PKG}"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.10.1'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'com.squareup.retrofit2:retrofit:2.9.0'
            implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
            implementation 'com.squareup.okhttp3:okhttp:4.11.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
            implementation 'androidx.lifecycle:lifecycle-service:2.6.1'
        }
        EOF
        fi

    - name: Compilar APK con Setup Gradle Action
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
        build-root-directory: 'android-app'
        arguments: ':app:assembleDebug --stacktrace'

    - name: Subir APK Generado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "android-app/app/build/outputs/apk/debug/*.apk"
