name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Localizar Proyecto y Crear Configuraciones
      run: |
        # 1. Encontrar la carpeta donde realmente reside el codigo fuente (busca la carpeta src)
        SRC_DIR=$(find . -maxdepth 4 -type d -name "src" | head -n 1)
        APP_DIR=$(dirname "$SRC_DIR")
        
        echo "Directorio app detectado en: $APP_DIR"
        mkdir -p "$APP_DIR"
        ROOT_DIR=$(dirname "$APP_DIR")
        if [ "$ROOT_DIR" = "." ]; then ROOT_DIR="."; fi

        # 2. Configurar settings.gradle
        cat << 'EOF' > "$ROOT_DIR/settings.gradle"
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "DespeApp"
        include ':app'
        EOF

        # 3. Configurar build.gradle Raiz
        cat << 'EOF' > "$ROOT_DIR/build.gradle"
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22'
            }
        }
        EOF

        # 4. Configurar app/build.gradle
        cat << 'EOF' > "$APP_DIR/build.gradle"
        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'

        android {
            namespace 'com.example.builder'
            compileSdk 33

            defaultConfig {
                applicationId "com.example.builder"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }

            buildFeatures {
                viewBinding true
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.10.1'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'com.squareup.retrofit2:retrofit:2.9.0'
            implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
        }
        EOF

        # 5. Crear recursos XML esenciales (Evita fallos de estilos y strings)
        mkdir -p "$APP_DIR/src/main/res/values"
        cat << 'EOF' > "$APP_DIR/src/main/res/values/strings.xml"
        <resources>
            <string name="app_name">DespeApp</string>
        </resources>
        EOF

        cat << 'EOF' > "$APP_DIR/src/main/res/values/styles.xml"
        <resources>
            <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar" />
        </resources>
        EOF

        # Guardar la ruta del proyecto raiz para el siguiente paso
        echo "TARGET_DIR=$ROOT_DIR" >> $GITHUB_ENV

    - name: Compilar APK
      run: |
        cd "$TARGET_DIR"
        gradle wrapper --gradle-version 8.0 --distribution-type bin
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Subir APK Generado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
